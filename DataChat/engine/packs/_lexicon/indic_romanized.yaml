# Shared word list: Hindi and Marathi written in English letters, plus common English phrasing.
# Keys are what users type (lowercase). Values are the plain-English words the parser understands.
# Longer phrases are replaced before single words. Spelling variants close to a key (e.g. "pichhley")
# are matched automatically, so only add genuinely different words.

replacements:
  # ── time ────────────────────────────────────────────────────────────────
  aaj: today
  aj: today
  aajcha: today
  aajchi: today
  kal: yesterday          # past-tense questions only; data questions are about the past
  kaal: yesterday
  kalcha: yesterday
  kalchi: yesterday
  parso: day before yesterday
  parva: day before yesterday
  hafta: week
  hafte: week
  hapta: week
